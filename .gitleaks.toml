# gitleaks（CI の secrets ジョブ）の設定。既定のルールに許可リストを足す
[extend]
useDefault = true

# R2 のオブジェクトキー（koudens/...）は API キーではない
[[allowlists]]
description = "R2 のオブジェクトキー"
targetRules = ["generic-api-key"]
regexes = ['''^koudens/''']

# 公開済みの履歴にある検出（2026-10-21 に確認）。履歴は書き換えず、本物の鍵なら無効にして作り直す
# - AGENTS.md / legacy/AGENTS.md: Stripe のテストモードの鍵（sk_test_）の記載
# - docs/security/environment-variables.md: Slack の Webhook URL（GitHub のシークレットスキャンで解決済み）
# - .env.example: 旧アプリの JWT
[[allowlists]]
description = "公開済みの履歴にある検出"
condition = "AND"
commits = [
	"c289afbfc18b28e59be9c270a83733c8296acc16",
	"061b39e74bace962355b32ec96249d7fa683d7c2",
	"22c0783d28a11f5a161440429d852104d775b41d",
	"0e32c38f5e6ad50298fdc442cb311ee682d7197e",
	"bc1a11fd897478fa1b1168d2cc54aa0bbd5f88a7",
	"3f174c46a291f704ea3519601bcb29771db17097",
	"909efcbeb7eb28848c2ba5e34c93554a8373c9f1",
]
paths = [
	'''^(legacy/)?AGENTS\.md$''',
	'''^docs/security/environment-variables\.md$''',
	'''^\.env\.example$''',
]

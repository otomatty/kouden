name: Secrets

# legacy/ だけの変更も検査するため、v2 CI と分けてパスで絞り込まない
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Git の全履歴から秘密情報（API キー・トークンなど）を探す。誤検知は .gitleaks.toml、検査済みの検出は .gitleaksignore で除外する
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks

      # 検出した値はログに出さない（--redact）
      - name: Scan
        run: $RUNNER_TEMP/gitleaks git --redact --no-banner --verbose .

name: v2 CI

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-*.yml"
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-*.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: v2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 依存パッケージのスクリプトから GitHub トークンを読めないよう、認証情報を残さない
          persist-credentials: false

      # cf は Node.js 22 以上で動く
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # ローカルの cf dev（利用者向けアプリ・運営者画面）に対する Playwright の E2E とアクセシビリティの検査（v2/e2e）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @playwright/test と同じ版の Chromium を入れる
      - name: Install Chromium
        working-directory: v2/e2e
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            v2/e2e/playwright-report/
            v2/e2e/test-results/
          retention-days: 7

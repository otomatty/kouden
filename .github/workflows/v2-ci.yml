name: v2 CI

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-*.yml"
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-*.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: v2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cf は Node.js 22 以上で動く
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

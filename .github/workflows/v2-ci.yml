name: v2 CI

on:
  pull_request:
    paths-ignore:
      - "legacy/**"
  push:
    branches: [main]
    paths-ignore:
      - "legacy/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 依存パッケージのスクリプトから GitHub トークンを読めないよう、認証情報を残さない
          persist-credentials: false

      # cf は Node.js 22 以上で動く
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Git の全履歴から秘密情報（API キー・トークンなど）を探す。誤検知は .gitleaks.toml で除外する
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks

      # 検出した値はログに出さない（--redact）
      - name: Scan
        run: $RUNNER_TEMP/gitleaks git --redact --no-banner --verbose .

  # ローカルの cf dev（利用者向けアプリ・運営者画面）に対する Playwright の E2E とアクセシビリティの検査（e2e/）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @playwright/test と同じ版の Chromium を入れる
      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

name: v2 Deploy

# 手動実行のみ。GitHub の Environments（staging / production）にシークレットと承認ルールを設定する
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "デプロイ先"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: v2-deploy-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode }}
    env:
      MODE: ${{ inputs.mode }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 依存パッケージのスクリプトから GitHub トークンを読めないよう、認証情報を残さない
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check deploy settings
        working-directory: apps/app
        run: bun run check:deploy -- --mode "$MODE"

      # 運営者画面（Access の設定など）も、デプロイを始める前に検査する
      - name: Check deploy settings (admin)
        working-directory: apps/admin
        run: bun run check:deploy -- --mode "$MODE"

      - name: Test
        run: bun run test

      # 初回（DB 作成前）はスキップされる
      - name: Apply D1 migrations
        working-directory: apps/app
        run: bun run db:migrate -- --mode "$MODE" --allow-missing

      # 郵便番号から住所を入れるデータ（docs/rebuild/08 案 E）。日本郵便の最新のデータから、デプロイのたびに作る
      - name: Build postal code data
        working-directory: apps/app
        run: bun run postal -- --download

      # シークレットはシェルに直接展開せず、環境変数経由で書き出す
      - name: Write secrets file
        working-directory: apps/app
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: bun scripts/write-deploy-secrets.ts "$RUNNER_TEMP/secrets.json"

      - name: Deploy
        working-directory: apps/app
        run: bun run deploy -- --mode "$MODE" --secrets-file "$RUNNER_TEMP/secrets.json"

      # 初回デプロイで DB が作られた場合に、ここで適用される（2 回目以降は何もしない）
      - name: Apply D1 migrations (after first deploy)
        working-directory: apps/app
        run: bun run db:migrate -- --mode "$MODE"

      # 運営者画面は利用者向けアプリの後に出す（同じ D1 を使い、マイグレーションはアプリ側で適用済み）
      - name: Deploy admin
        working-directory: apps/admin
        run: bun run deploy -- --mode "$MODE"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
